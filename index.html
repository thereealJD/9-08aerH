      // --- Drag and drop functions ---
      function handleDragStart(e) {
        const node = e.target.closest('.vault-node');
        if (!node) return;
        if (e.target.closest('.rename-input') || e.target.closest('.vault-actions')) {
          e.preventDefault();
          return;
        }
        const id = node.dataset.id;
        const n = findNodeById(id);
        if (!n) return;
        dragData = { nodeId: id, node: n };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
        node.classList.add('dragging');
        setTimeout(() => node.classList.remove('dragging'), 0);
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        const target = e.target.closest('.vault-node');
        if (!target) {
          document.querySelectorAll('.vault-node').forEach(el => {
            el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target');
          });
          return;
        }
        const targetId = target.dataset.id;
        if (!dragData || targetId === dragData.nodeId) {
          document.querySelectorAll('.vault-node').forEach(el => {
            el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target');
          });
          return;
        }
        const draggedNode = findNodeById(dragData.nodeId);
        if (draggedNode && draggedNode.type === 'folder') {
          let isDescendant = false;
          function checkDesc(nodes) {
            for (const n of nodes) {
              if (n.id === targetId) isDescendant = true;
              if (n.type === 'folder') checkDesc(n.children);
              if (isDescendant) return;
            }
          }
          checkDesc(draggedNode.children);
          if (isDescendant) {
            document.querySelectorAll('.vault-node').forEach(el => {
              el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target');
            });
            return;
          }
        }

        const rect = target.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const threshold = rect.height / 3;
        let position = 'below';
        if (y < threshold) position = 'above';
        else if (y > rect.height - threshold) position = 'below';
        else position = 'inside';

        const targetNode = findNodeById(targetId);
        const canInside = targetNode && targetNode.type === 'folder';

        document.querySelectorAll('.vault-node').forEach(el => {
          el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target');
        });

        if (position === 'inside' && canInside) {
          target.classList.add('drag-over-inside', 'drop-target');
        } else if (position === 'above') {
          target.classList.add('drag-over-above');
        } else {
          target.classList.add('drag-over-below');
        }
        target.dataset.dropPosition = position;
        target.dataset.dropTarget = targetId;
      }

      function handleDragLeave(e) {
        const target = e.target.closest('.vault-node');
        if (target) {
          target.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target');
        }
      }

      function handleDrop(e) {
        e.preventDefault();
        document.querySelectorAll('.vault-node').forEach(el => {
          el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target', 'dragging');
        });

        const target = e.target.closest('.vault-node');
        if (!target || !dragData) return;

        const targetId = target.dataset.dropTarget || target.dataset.id;
        if (!targetId) return;
        const position = target.dataset.dropPosition || 'below';

        const draggedId = dragData.nodeId;
        if (draggedId === targetId) return;

        const draggedNode = findNodeById(draggedId);
        const targetNode = findNodeById(targetId);
        if (!draggedNode || !targetNode) return;

        if (draggedNode.type === 'folder') {
          let isDescendant = false;
          function checkDesc(nodes) {
            for (const n of nodes) {
              if (n.id === targetId) isDescendant = true;
              if (n.type === 'folder') checkDesc(n.children);
              if (isDescendant) return;
            }
          }
          checkDesc(draggedNode.children);
          if (isDescendant) return;
        }

        const oldParent = findParentNode(draggedId);
        if (oldParent) {
          oldParent.children = oldParent.children.filter(n => n.id !== draggedId);
        } else {
          vaultTree = vaultTree.filter(n => n.id !== draggedId);
        }

        let newParent = null;

        if (position === 'inside' && targetNode.type === 'folder') {
          newParent = targetNode;
          if (!newParent.children) newParent.children = [];
          newParent.children.unshift(draggedNode);
          newParent.isOpen = true;
        } else {
          const targetParent = findParentNode(targetId);
          let siblings = targetParent ? targetParent.children : vaultTree;
          const targetIndex = siblings.findIndex(n => n.id === targetId);
          if (targetIndex === -1) {
            vaultTree.push(draggedNode);
          } else {
            const insertIdx = position === 'above' ? targetIndex : targetIndex + 1;
            siblings.splice(insertIdx, 0, draggedNode);
          }
        }

        saveVaultTree();
        renderLearnedWordsList();
        if (selectedPracticeWord) {
          const stillExists = learnedWords[selectedPracticeWord.word.toLowerCase()];
          if (!stillExists) selectedPracticeWord = null;
        }
        dragData = null;
      }

      function handleDragEnd(e) {
        document.querySelectorAll('.vault-node').forEach(el => {
          el.classList.remove('drag-over', 'drag-over-above', 'drag-over-below', 'drag-over-inside', 'drop-target', 'dragging');
        });
        dragData = null;
      }

      // --- Rendering vault list ---
      function renderLearnedWordsList() {
        const term = practiceSearchInput.value.toLowerCase();
        const sortBy = document.getElementById('vaultSortBtn')?.dataset.value || 'newest';
        const filterBy = document.getElementById('customFilterTrigger')?.dataset.value || 'unassigned';

        if (filterBy !== 'unassigned' && filterBy !== 'all') {
          const groupName = filterBy;
          let words = Object.values(learnedWords).filter(w => w.groups && w.groups.includes(groupName));
          if (term) {
            words = words.filter(w => w.word.toLowerCase().includes(term));
          }
          if (sortBy === 'newest') words.sort((a, b) => b.learnedAt - a.learnedAt);
          else if (sortBy === 'oldest') words.sort((a, b) => a.learnedAt - b.learnedAt);
          else words.sort((a, b) => a.word.localeCompare(b.word));

          if (!words.length) {
            learnedWordsList.innerHTML = `<div class="empty-state">グループ "${groupName}" に単語がありません</div>`;
            return;
          }

          learnedWordsList.innerHTML = words.map(w => {
            const isActive = selectedPracticeWord && selectedPracticeWord.word.toLowerCase() === w.word.toLowerCase();
            return `<div class="flat-word-item ${isActive ? 'active-word' : ''}" data-word="${w.word}">
              <span style="flex:1; cursor:pointer;">${w.word}</span>
              <button class="delete-word-btn" data-word="${w.word}">削除</button>
            </div>`;
          }).join('');

          learnedWordsList.querySelectorAll('.flat-word-item span').forEach(span => {
            span.addEventListener('click', (e) => {
              const word = span.parentElement.dataset.word;
              selectPracticeWord(word);
            });
          });
          learnedWordsList.querySelectorAll('.delete-word-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const word = btn.dataset.word;
              deleteWordCompletely(word);
              renderLearnedWordsList();
              if (selectedPracticeWord && selectedPracticeWord.word.toLowerCase() === word.toLowerCase()) {
                selectedPracticeWord = null;
                renderPracticeOnly();
              }
            });
          });
          return;
        }

        function sortNodes(nodes) {
          return nodes.slice().sort((a, b) => {
            if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
            const nameA = (a.type === 'folder' ? a.name : a.word).toLowerCase();
            const nameB = (b.type === 'folder' ? b.name : b.word).toLowerCase();
            if (sortBy === 'az') return nameA.localeCompare(nameB);
            const tA = a.createdAt || 0;
            const tB = b.createdAt || 0;
            return sortBy === 'newest' ? tB - tA : tA - tB;
          });
        }

        function buildTreeHtml(nodes, depth) {
          let res = '';
          const sorted = sortNodes(nodes);
          for (const node of sorted) {
            if (!nodeMatchesFilter(node, term, filterBy)) continue;

            const indent = depth * 16 + 8;
            if (node.type === 'folder') {
              if (node.id === editingNodeId) {
                res += `<div class="vault-node" style="padding-left:${indent}px; cursor:default;" draggable="false">
                  <input type="text" class="rename-input" data-id="${node.id}" value="${node.name}" />
                </div>`;
              } else {
                const isAttachedActive = selectedPracticeWord && node.attachedWord && selectedPracticeWord.word.toLowerCase() === node.attachedWord.toLowerCase();
                res += `<div class="vault-node vault-folder ${isAttachedActive ? 'active-word' : ''}" data-id="${node.id}" style="padding-left:${indent}px" draggable="true">
                  <span class="vault-toggle ${node.isOpen ? 'open' : ''}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                  </span>
                  <span class="vault-label ${node.attachedWord ? 'attached' : ''}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                    ${node.name}
                  </span>
                  <div class="vault-spacer"></div>
                  <div class="vault-actions">
                    <button class="vault-icon-btn add-subfolder-btn" data-id="${node.id}" title="追加検索">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <button class="vault-icon-btn folder-more-btn" data-id="${node.id}" data-type="folder" title="オプション">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    </button>
                  </div>
                </div>`;
              }

              if (node.id === activeFolderSearchId) {
                res += `<div class="vault-node folder-search-node" style="padding-left:${indent + 16}px; cursor:default; background:transparent;" draggable="false">
                  <div style="position:relative; width:100%;">
                    <input type="text" class="search-input folder-search-input" data-folder-id="${node.id}" placeholder="追加する単語を検索…" />
                    <div class="search-dropdown folder-search-dropdown" style="display:none; position:absolute; top:100%; left:0; width:100%; z-index:120; max-height:200px; overflow-y:auto;"></div>
                  </div>
                </div>`;
              }

              if (node.isOpen || (term && nodeMatchesFilter(node, term, filterBy))) {
                res += buildTreeHtml(node.children, depth + 1);
              }
            } else {
              const isActive = selectedPracticeWord && selectedPracticeWord.word.toLowerCase() === node.word.toLowerCase();
              res += `<div class="vault-node vault-word ${isActive ? 'active-word' : ''}" data-id="${node.id}" style="padding-left:${indent + 22}px" draggable="true">
                <span class="vault-label">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                  ${node.word}
                </span>
                <div class="vault-spacer"></div>
                <div class="vault-actions">
                  <button class="vault-icon-btn folder-more-btn" data-id="${node.id}" data-type="word" title="オプション">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                  </button>
                </div>
              </div>`;
            }
          }
          return res;
        }

        const html = buildTreeHtml(vaultTree, 0);
        if (!html) learnedWordsList.innerHTML = '<div class="empty-state">一致するアイテムがありません</div>';
        else learnedWordsList.innerHTML = html;

        learnedWordsList.querySelectorAll('.vault-node[draggable="true"]').forEach(el => {
          el.addEventListener('dragstart', handleDragStart);
          el.addEventListener('dragover', handleDragOver);
          el.addEventListener('dragleave', handleDragLeave);
          el.addEventListener('drop', handleDrop);
          el.addEventListener('dragend', handleDragEnd);
        });

        const renameInp = learnedWordsList.querySelector('.rename-input');
        if (renameInp) {
          renameInp.focus();
          renameInp.select();
        }
      }

      function selectPracticeWord(word) {
        if (!learnedWords[word.toLowerCase()]) return;
        selectedPracticeWord = learnedWords[word.toLowerCase()];
        renderLearnedWordsList();
        renderPracticeOnly();
      }

      // --- Vault event handling ---
      learnedWordsList.addEventListener('click', (e) => {
        const nodeEl = e.target.closest('.vault-node');
        if (!nodeEl) return;
        const id = nodeEl.dataset.id;
        const node = findNodeById(id);

        if (e.target.closest('.add-subfolder-btn')) {
          e.stopPropagation();
          if (node && node.type === 'folder') {
            activeFolderSearchId = activeFolderSearchId === node.id ? null : node.id;
            node.isOpen = true;
            saveVaultTree();
            renderLearnedWordsList();

            if (activeFolderSearchId) {
              setTimeout(() => {
                const inp = document.querySelector(`.folder-search-input[data-folder-id="${node.id}"]`);
                if (inp) inp.focus();
              }, 50);
            }
          }
          return;
        }

        if (e.target.closest('.folder-more-btn')) {
          e.stopPropagation();
          contextMenuNodeId = e.target.closest('.folder-more-btn').dataset.id;
          contextMenuNodeType = e.target.closest('.folder-more-btn').dataset.type;

          const ctxMakeFolderWord = document.getElementById('ctxMakeFolderWord');
          const ctxMakeWord = document.getElementById('ctxMakeWord');
          const ctxRename = document.getElementById('ctxRename');

          if (contextMenuNodeType === 'word') {
            ctxMakeFolderWord.style.display = 'block';
            ctxMakeWord.style.display = 'none';
            ctxRename.style.display = 'none';
          } else {
            ctxMakeFolderWord.style.display = 'none';
            ctxMakeWord.style.display = 'block';
            ctxRename.style.display = 'block';
          }

          const rect = e.target.closest('.folder-more-btn').getBoundingClientRect();
          vaultContextMenu.style.display = 'block';
          vaultContextMenu.style.left = `${rect.right + 5}px`;
          vaultContextMenu.style.top = `${rect.top}px`;
          if (rect.top + vaultContextMenu.offsetHeight > window.innerHeight) {
            vaultContextMenu.style.top = `${window.innerHeight - vaultContextMenu.offsetHeight - 10}px`;
          }
          return;
        }

        if (e.target.closest('.vault-toggle')) {
          e.stopPropagation();
          if (node && node.type === 'folder') {
            node.isOpen = !node.isOpen;
            saveVaultTree();
            renderLearnedWordsList();
          }
          return;
        }

        if (e.target.closest('.vault-label')) {
          e.stopPropagation();
          if (node) {
            if (node.type === 'folder' && node.attachedWord) {
              selectPracticeWord(node.attachedWord);
            } else if (node.type === 'word') {
              selectPracticeWord(node.word);
            } else {
              node.isOpen = !node.isOpen;
              saveVaultTree();
              renderLearnedWordsList();
            }
          }
          return;
        }

        if (node) {
          if (node.type === 'folder') {
            node.isOpen = !node.isOpen;
            saveVaultTree();
            renderLearnedWordsList();
          } else {
            selectPracticeWord(node.word);
          }
        }
      });

      learnedWordsList.addEventListener('blur', (e) => {
        if (e.target.classList.contains('rename-input')) {
          handleRename(e.target);
        }
      }, true);

      learnedWordsList.addEventListener('keydown', (e) => {
        if (e.target.classList.contains('rename-input') && e.key === 'Enter') {
          handleRename(e.target);
        }
      });

      function handleRename(inputEl) {
        const id = inputEl.dataset.id;
        const node = findNodeById(id);
        if (node && node.type === 'folder') {
          const val = inputEl.value.trim();
          node.name = val || "無題のフォルダ";
          editingNodeId = null;
          saveVaultTree();
          renderLearnedWordsList();
        }
      }

      learnedWordsList.addEventListener('input', async (e) => {
        if (e.target.classList.contains('folder-search-input')) {
          const dropdown = e.target.nextElementSibling;
          const folderId = e.target.dataset.folderId;
          handleSearchInputShared(e, dropdown, folderId);
        }
      });

      // Unified search that handles both txt intersection and Hiragana -> Kanji via Jisho API
      async function handleSearchInputShared(e, dropdown, folderId = null) {
        const val = e.target.value.toLowerCase().trim();
        if (!val) {
          dropdown.style.display = 'none';
          dropdown.classList.remove('active');
          return;
        }
        if (!combinedWordList) await fetchCombinedWordList();

        // 1. Initial quick local search
        let matches = combinedWordList.filter(w => w.startsWith(val) || w.includes(val)).slice(0, 15);

        // 2. Fetch Jisho API for Hiragana to Kanji suggestions
        try {
            const jRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://jisho.org/api/v1/search/words?keyword=' + word)}`);
const proxyData = await jRes.json();
const jData = JSON.parse(proxyData.contents);
            if (jData.data) {
                const jishoWords = jData.data.flatMap(d => d.japanese.map(j => j.word).filter(Boolean));
                // Intersect with local dictionary to guarantee valid words
                const validJishoWords = jishoWords.filter(w => combinedWordList.includes(w));
                matches = Array.from(new Set([...matches, ...validJishoWords])).slice(0, 50);
            }
        } catch (err) {}

        if (matches.length === 0) {
          dropdown.innerHTML = `<div class="search-result-item" style="color:#a39c91;">結果なし</div>`;
        } else {
          dropdown.innerHTML = matches.map(w => {
            return `<div class="search-result-item" data-word="${w}">
              <span style="font-weight:500;">${w}</span>
              <button class="add-to-practice-btn">追加</button>
            </div>`;
          }).join('');

          dropdown.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', (ev) => {
              ev.stopPropagation();
              const w = item.dataset.word;
              addWordToPractice(w, folderId);
              activeFolderSearchId = null;
              renderLearnedWordsList();
            });
          });
        }
        dropdown.style.display = 'block';
        dropdown.classList.add('active');
      }

      // Close search when clicking outside
      document.addEventListener('click', (e) => {
        if (activeFolderSearchId) {
          const searchNode = document.querySelector(`.folder-search-node`);
          if (searchNode && !searchNode.contains(e.target)) {
            activeFolderSearchId = null;
            renderLearnedWordsList();
          }
        }
        if (vaultContextMenu && !vaultContextMenu.contains(e.target) && !e.target.closest('.folder-more-btn')) {
          vaultContextMenu.style.display = 'none';
        }
        const vwrap = document.getElementById('vaultSortWrapper');
        if (vwrap && !vwrap.contains(e.target)) {
          document.getElementById('vaultSortDropdown').classList.remove('active');
        }
        const fwrap = document.getElementById('customFilterWrapper');
        if (fwrap && !fwrap.contains(e.target)) {
          document.getElementById('customFilterDropdown').classList.remove('active');
        }
        if (searchDropdown && !searchWordInput.contains(e.target) && !searchDropdown.contains(e.target)) {
          searchDropdown.classList.remove('active');
          searchDropdown.style.display = 'none';
        }
        document.querySelectorAll('.folder-search-dropdown').forEach(dd => {
          if (dd.classList.contains('active')) {
            const inp = dd.previousElementSibling;
            if (e.target !== inp && !dd.contains(e.target)) {
              dd.classList.remove('active');
              dd.style.display = 'none';
            }
          }
        });
      });

      // --- Vault Action Buttons ---
      document.getElementById('createFolderBtn').addEventListener('click', async () => {
        const name = await customPrompt('新規フォルダ作成', '新しいフォルダ');
        if (name) {
          vaultTree.unshift({ id: genId(), type: 'folder', name: name.trim(), children: [], isOpen: true, createdAt: Date.now() });
          saveVaultTree();
          renderLearnedWordsList();
        }
      });
      document.getElementById('expandAllBtn').addEventListener('click', () => {
        function recurse(nodes) { nodes.forEach(n => { if (n.type === 'folder') { n.isOpen = true; recurse(n.children); } }); }
        recurse(vaultTree); saveVaultTree(); renderLearnedWordsList();
      });
      document.getElementById('collapseAllBtn').addEventListener('click', () => {
        function recurse(nodes) { nodes.forEach(n => { if (n.type === 'folder') { n.isOpen = false; recurse(n.children); } }); }
        recurse(vaultTree); saveVaultTree(); renderLearnedWordsList();
      });

      document.getElementById('vaultSortBtn').addEventListener('click', () => {
        document.getElementById('vaultSortDropdown').classList.toggle('active');
      });
      document.querySelectorAll('#vaultSortDropdown .custom-select-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
          const val = e.target.dataset.value;
          document.getElementById('vaultSortBtn').dataset.value = val;
          document.getElementById('vaultSortDropdown').classList.remove('active');
          renderLearnedWordsList();
        });
      });

      document.getElementById('customFilterTrigger').addEventListener('click', () => {
        document.getElementById('customFilterDropdown').classList.toggle('active');
      });

      function updateCustomFilterDropdown() {
        const dd = document.getElementById('customFilterDropdown');
        let html = `<div class="custom-select-option" data-value="unassigned">未割り当て</div>
                    <div class="custom-select-option" data-value="all">すべて</div>`;
        userGroups.forEach(g => {
          html += `<div class="custom-select-option" data-value="${g}">${g}</div>`;
        });
        dd.innerHTML = html;
        dd.querySelectorAll('.custom-select-option').forEach(opt => {
          opt.addEventListener('click', (e) => {
            const val = e.target.dataset.value;
            const trigger = document.getElementById('customFilterTrigger');
            trigger.dataset.value = val;
            trigger.textContent = val === 'unassigned' ? '未割り当て' : (val === 'all' ? 'すべて' : val);
            dd.classList.remove('active');
            renderLearnedWordsList();
          });
        });
      }

      practiceSearchInput.addEventListener('input', () => { renderLearnedWordsList(); });

      // --- Context Menu Actions ---
      document.getElementById('ctxRename').addEventListener('click', () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (node && node.type === 'folder') {
          editingNodeId = contextMenuNodeId;
          renderLearnedWordsList();
        }
      });
      document.getElementById('ctxDelete').addEventListener('click', async () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (node) {
          const yes = await customConfirm('削除の確認', `「${node.type === 'folder' ? node.name : node.word}」を削除してもよろしいですか？`);
          if (yes) {
            if (node.type === 'folder') {
              removeNodeFromParent(node.id);
            } else {
              deleteWordCompletely(node.word);
            }
            if (selectedPracticeWord && node.type === 'word' && selectedPracticeWord.word.toLowerCase() === node.word.toLowerCase()) {
              selectedPracticeWord = null;
              renderPracticeOnly();
            }
            saveVaultTree();
            renderLearnedWordsList();
          }
        }
      });
      document.getElementById('ctxMakeFolderWord').addEventListener('click', () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (node && node.type === 'word') {
          node.type = 'folder';
          node.name = node.word;
          node.attachedWord = node.word;
          node.children = [];
          node.isOpen = true;
          delete node.word;
          saveVaultTree();
          renderLearnedWordsList();
        }
      });
      document.getElementById('ctxMakeWord').addEventListener('click', () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (node && node.type === 'folder') {
          node.type = 'word';
          node.word = node.attachedWord || node.name;
          delete node.name;
          delete node.children;
          delete node.isOpen;
          delete node.attachedWord;
          saveVaultTree();
          renderLearnedWordsList();
        }
      });
      document.getElementById('ctxCopy').addEventListener('click', () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (node) {
          const clone = JSON.parse(JSON.stringify(node));
          function genNewIds(n) {
            n.id = genId();
            if (n.type === 'folder') n.children.forEach(genNewIds);
          }
          genNewIds(clone);
          if (clone.type === 'folder') clone.name += ' (コピー)';
          const parent = findParentNode(contextMenuNodeId);
          if (parent) parent.children.push(clone);
          else vaultTree.push(clone);
          saveVaultTree();
          renderLearnedWordsList();
        }
      });
      document.getElementById('ctxMove').addEventListener('click', () => {
        vaultContextMenu.style.display = 'none';
        const node = findNodeById(contextMenuNodeId);
        if (!node) return;
        
        let options = '<option value="root">ルート (メイン)</option>';
        function buildOptions(nodes, depth, disabledId) {
          for (const n of nodes) {
            if (n.type === 'folder') {
              const isDisabled = (n.id === disabledId || (node.type==='folder' && isDescendant(node, n.id)));
              options += `<option value="${n.id}" ${isDisabled?'disabled':''}>${'&nbsp;'.repeat(depth*4)}${n.name}</option>`;
              buildOptions(n.children, depth+1, disabledId);
            }
          }
        }
        function isDescendant(parentObj, checkId) {
          if (parentObj.id === checkId) return true;
          if (parentObj.children) {
            for (const c of parentObj.children) {
              if (c.type === 'folder' && isDescendant(c, checkId)) return true;
            }
          }
          return false;
        }
        buildOptions(vaultTree, 0, node.id);
        
        document.getElementById('moveSelect').innerHTML = options;
        document.getElementById('moveModal').classList.add('active');
        
        document.getElementById('confirmMoveBtn').onclick = () => {
          const destId = document.getElementById('moveSelect').value;
          removeNodeFromParent(node.id);
          if (destId === 'root') {
            vaultTree.push(node);
          } else {
            const destNode = findNodeById(destId);
            if (destNode && destNode.type === 'folder') {
              destNode.children.push(node);
              destNode.isOpen = true;
            } else {
              vaultTree.push(node);
            }
          }
          saveVaultTree();
          renderLearnedWordsList();
          document.getElementById('moveModal').classList.remove('active');
        };
        document.getElementById('cancelMoveBtn').onclick = () => {
          document.getElementById('moveModal').classList.remove('active');
        };
      });

      // --- Top Search / Add Logic ---
      searchWordInput.addEventListener('input', (e) => handleSearchInputShared(e, searchDropdown));

      // --- Definition parsing / Practice render ---
      function parseSentences(text) {
        if (!text) return [];
        return text.split('\n')
          .map(l => l.trim())
          .filter(l => l.length > 0 && /^[a-zA-Z\u00C0-\u024F]/.test(l));
      }

      function renderPracticeOnly() {
        if (!selectedPracticeWord) {
          practiceHeaderContainer.innerHTML = '<div class="empty-state">左側から単語を選択してください。</div>';
          typeContainer.innerHTML = '';
          return;
        }

        const isCustom = customDefinitions[selectedPracticeWord.word.toLowerCase()];
        const pDef = selectedPracticeWord.definitionHTML || selectedPracticeWord.shortDef || '定義が見つかりません。';

        let groupsHtml = selectedPracticeWord.groups && selectedPracticeWord.groups.length > 0
          ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">${selectedPracticeWord.groups.map(g => `<span class="group-tag">${g}</span>`).join('')}</div>` : '';

        practiceHeaderContainer.innerHTML = `
          <div class="practice-word-header">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div class="practice-word-title">${selectedPracticeWord.word}</div>
              <div style="display:flex; gap:8px;">
                <button class="btn" style="padding:4px 8px; font-size:12px; height:auto;" id="editGroupsBtn">グループ管理</button>
                <button class="btn" style="padding:4px 8px; font-size:12px; height:auto;" id="editCustomDefBtn">カスタム定義</button>
              </div>
            </div>
            ${groupsHtml}
            <div class="practice-full-def">${pDef}</div>
          </div>
        `;

        document.getElementById('editCustomDefBtn').addEventListener('click', () => {
          currentEditingWord = selectedPracticeWord.word.toLowerCase();
          modalWordTitle.textContent = selectedPracticeWord.word + " (カスタム定義)";
          if (customDefinitions[currentEditingWord]) {
            customFreeWriteInput.value = customDefinitions[currentEditingWord].raw;
            deleteCustomDefBtn.style.display = 'block';
          } else {
            customFreeWriteInput.value = '';
            deleteCustomDefBtn.style.display = 'none';
          }
          customDefModal.classList.add('active');
        });

        document.getElementById('editGroupsBtn').addEventListener('click', () => {
          document.getElementById('groupModalWordName').textContent = selectedPracticeWord.word;
          renderGroupModalList();
          document.getElementById('groupModal').classList.add('active');
        });

        const ex = (selectedPracticeWord.sentences && selectedPracticeWord.sentences.length) ? selectedPracticeWord.sentences : [];
        typeContainer.innerHTML = `
          <div class="type-section quiz-module">
            <div class="section-title">自分で文を作る</div>
            <input type="text" class="sentence-input" id="ownSentenceInput" placeholder="この単語を使った文を入力してEnter..." autocomplete="off" />
            <div id="ownSentenceFeedback" class="feedback-text"></div>
            <div class="sentences-dropdown" id="savedSentences">
              ${ex.map((s, i) => `<div class="sentence-item"><span class="sentence-number">${i+1}.</span><span style="flex:1;">${s}</span><button class="vault-icon-btn del-sentence-btn" data-idx="${i}" style="color:#b85c5c;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`).join('')}
            </div>
          </div>
        `;

        const sInp = document.getElementById('ownSentenceInput');
        sInp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const val = sInp.value.trim();
            if (!val) return;
            if (!selectedPracticeWord.sentences) selectedPracticeWord.sentences = [];
            selectedPracticeWord.sentences.push(val);
            saveLearnedWords();
            renderPracticeOnly();
          }
        });
        document.querySelectorAll('.del-sentence-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.currentTarget.dataset.idx, 10);
            selectedPracticeWord.sentences.splice(idx, 1);
            saveLearnedWords();
            renderPracticeOnly();
          });
        });
      }

      // --- Custom Definitions ---
      cancelCustomDefBtn.addEventListener('click', () => { customDefModal.classList.remove('active'); });
      deleteCustomDefBtn.addEventListener('click', () => {
        delete customDefinitions[currentEditingWord];
        if (learnedWords[currentEditingWord]) {
          learnedWords[currentEditingWord].definitionHTML = '';
          learnedWords[currentEditingWord].shortDef = '';
        }
        saveCustomDefinitions();
        saveLearnedWords();
        customDefModal.classList.remove('active');
        if (selectedPracticeWord && selectedPracticeWord.word.toLowerCase() === currentEditingWord) {
          fetchFullDefinitionData(selectedPracticeWord.word).then(data => {
            if (data && learnedWords[currentEditingWord]) {
              learnedWords[currentEditingWord].definitionHTML = data.definitionHTML || '';
              learnedWords[currentEditingWord].shortDef = data.shortDef || '';
              saveLearnedWords();
            }
            renderPracticeOnly();
          });
        }
      });
      saveCustomDefBtn.addEventListener('click', () => {
        const val = customFreeWriteInput.value.trim();
        if (!val) return;
        
        const lines = val.split('\n');
        let html = '';
        let sDef = lines[0];

        lines.forEach(l => {
          const t = l.trim();
          if (t.startsWith('@pos ')) html += `<span class="fl-label">${t.substring(5)}</span>\n`;
          else if (t.startsWith('@pron ')) html += `<span class="pron">${t.substring(6)}</span>\n`;
          else if (/^\d+\s*--\s*/.test(t)) {
            const m = t.match(/^(\d+)\s*--\s*(.*)/);
            html += `<div class="sense-block"><span class="sense-num">${m[1]}</span> ${m[2]}</div>\n`;
            if (!sDef || sDef.startsWith('@')) sDef = m[2];
          }
          else if (/^\d+\s*-\s*/.test(t)) {
            const m = t.match(/^(\d+)\s*-\s*(.*)/);
            html += `<div class="sense-block"><span class="sense-num">${m[1]} a</span> ${m[2]}</div>\n`;
            if (!sDef || sDef.startsWith('@')) sDef = m[2];
          }
          else if (/^--\s*/.test(t)) html += `<div class="sub-sense" style="margin-left:3em!important;"><span class="sense-num">(1)</span> ${t.substring(2).trim()}</div>\n`;
          else if (/^-\s*/.test(t)) html += `<div class="sub-sense"><span class="sense-num">b</span> ${t.substring(1).trim()}</div>\n`;
          else html += `<div class="sense-block">${t}</div>\n`;
        });

        customDefinitions[currentEditingWord] = { raw: val, html, shortDef: sDef };
        saveCustomDefinitions();

        if (learnedWords[currentEditingWord]) {
          learnedWords[currentEditingWord].definitionHTML = html;
          learnedWords[currentEditingWord].shortDef = sDef;
          saveLearnedWords();
        }
        customDefModal.classList.remove('active');
        if (selectedPracticeWord && selectedPracticeWord.word.toLowerCase() === currentEditingWord) {
          renderPracticeOnly();
        }
      });

      // --- Group Modal ---
      document.getElementById('closeGroupModalBtn').addEventListener('click', () => {
        document.getElementById('groupModal').classList.remove('active');
        updateCustomFilterDropdown();
        renderLearnedWordsList();
        renderPracticeOnly();
      });

      document.getElementById('createNewGroupBtn').addEventListener('click', () => {
        const inp = document.getElementById('newGroupInput');
        const val = inp.value.trim();
        if (val && !userGroups.includes(val)) {
          userGroups.push(val);
          saveUserGroups();
          inp.value = '';
          renderGroupModalList();
        }
      });

      function renderGroupModalList() {
        const list = document.getElementById('groupModalList');
        if (!userGroups.length) {
          list.innerHTML = '<div class="empty-state" style="padding:10px 0;">グループがありません。</div>';
          return;
        }
        
        const wData = learnedWords[selectedPracticeWord.word.toLowerCase()];
        const assigned = wData.groups || [];

        list.innerHTML = userGroups.map(g => {
          const checked = assigned.includes(g) ? 'checked' : '';
          return `<div style="display:flex; align-items:center; justify-content:space-between; padding:8px; border:1px solid #e6e2d8; border-radius:6px; background:#faf8f5;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1;">
              <input type="checkbox" class="group-checkbox" data-group="${g}" ${checked} />
              <span style="font-size:14px; font-weight:500;">${g}</span>
            </label>
            <button class="vault-icon-btn del-group-btn" data-group="${g}" style="color:#b85c5c;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>`;
        }).join('');

        list.querySelectorAll('.group-checkbox').forEach(cb => {
          cb.addEventListener('change', (e) => {
            const g = e.target.dataset.group;
            if (!wData.groups) wData.groups = [];
            if (e.target.checked) {
              if (!wData.groups.includes(g)) wData.groups.push(g);
            } else {
              wData.groups = wData.groups.filter(x => x !== g);
            }
            saveLearnedWords();
          });
        });

        list.querySelectorAll('.del-group-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const g = e.currentTarget.dataset.group;
            const yes = await customConfirm('グループ削除', `「${g}」を削除してもよろしいですか？`);
            if (yes) {
              userGroups = userGroups.filter(x => x !== g);
              Object.values(learnedWords).forEach(w => {
                if (w.groups) w.groups = w.groups.filter(x => x !== g);
              });
              saveUserGroups();
              saveLearnedWords();
              renderGroupModalList();
            }
          });
        });
      }

      // --- Tabs ---
      function switchGameTab(tabName) {
        document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
        document.querySelector(`.game-tab[data-tab="${tabName}"]`).classList.add('active');
        if (tabName === 'write') document.getElementById('panelWrite').classList.add('active');
        else if (tabName === 'quiz') document.getElementById('panelQuiz').classList.add('active');
        else if (tabName === 'flashcards') document.getElementById('panelFlashcards').classList.add('active');
      }

      document.querySelectorAll('.game-tab').forEach(t => {
        t.addEventListener('click', (e) => switchGameTab(e.target.dataset.tab));
      });

      // --- Quiz Logic ---
      function startNewQuiz() {
        const words = Object.values(learnedWords);
        if (words.length < 2) {
          quizContainer.innerHTML = '<div class="empty-state">クイズを行うには最低2つの単語を学習する必要があります。</div>';
          return;
        }
        quizWord = words[Math.floor(Math.random() * words.length)];
        const others = words.filter(w => w.word !== quizWord.word);
        others.sort(() => Math.random() - 0.5);
        
        let pool = [quizWord, ...others.slice(0, 3)];
        pool.sort(() => Math.random() - 0.5);
        quizOptions = pool;
        quizCorrectIndex = pool.findIndex(w => w.word === quizWord.word);
        quizAnswered = false;
        renderQuizOnly();
      }

      function renderQuizOnly() {
        if (!quizWord) {
          quizContainer.innerHTML = '<div class="empty-state">クイズを行うには最低2つの単語を学習する必要があります。</div>';
          return;
        }
        const wDef = quizWord.shortDef || "定義が見つかりません。";
        
        quizContainer.innerHTML = `
          <div class="quiz-module">
            <div class="streak-row">連続正解: ${quizStreak}</div>
            <div class="quiz-word-header">
              <div class="quiz-word-title" style="font-size:16px; margin-bottom:8px;">「${quizWord.word}」の意味は？</div>
            </div>
            <div class="options-grid" id="quizOptionsGrid">
              ${quizOptions.map((opt, i) => `<button class="option-btn" data-idx="${i}">${opt.shortDef || '定義が見つかりません。'}</button>`).join('')}
            </div>
            <div class="quiz-feedback-row" id="quizFeedback"></div>
            <div class="quiz-actions" style="margin-top:16px;">
              <button class="btn btn-primary" id="nextQuizBtn" style="display:none;">次の問題</button>
            </div>
            <div class="quiz-full-def-link" id="quizDefLink">
              <div style="font-weight:600; margin-bottom:6px;">${quizWord.word}</div>
              <div style="color:#5c554d; line-height:1.6;">${quizWord.definitionHTML || quizWord.shortDef}</div>
            </div>
          </div>
        `;

        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            if (quizAnswered) return;
            quizAnswered = true;
            const idx = parseInt(e.target.dataset.idx, 10);
            const feedback = document.getElementById('quizFeedback');
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach((b, i) => {
              b.disabled = true;
              if (i === quizCorrectIndex) b.classList.add('selected-correct');
              else if (i === idx) b.classList.add('selected-wrong');
              else b.classList.add('dimmed');
            });

            if (idx === quizCorrectIndex) {
              quizStreak++;
              feedback.innerHTML = '<span style="color:#4a624d; font-weight:600;">正解！</span>';
            } else {
              quizStreak = 0;
              feedback.innerHTML = `<span style="color:#b85c5c; font-weight:600;">不正解。正解は: </span> <span style="font-size:13px; margin-left:4px;">${quizWord.shortDef}</span>`;
            }
            
            document.querySelector('.streak-row').textContent = `連続正解: ${quizStreak}`;
            document.getElementById('nextQuizBtn').style.display = 'inline-flex';
            document.getElementById('quizDefLink').classList.add('visible');
          });
        });

        document.getElementById('nextQuizBtn')?.addEventListener('click', startNewQuiz);
      }

      // --- Dictionary View ---
      function renderAlphabetRow() {
        const letters = 'あ,か,さ,た,な,は,ま,や,ら,わ'.split(',');
        let html = '<button class="letter-btn active-letter" data-letter="all">すべて</button>';
        letters.forEach(l => {
          html += `<button class="letter-btn" data-letter="${l}">${l}</button>`;
        });
        alphabetRow.innerHTML = html;

        alphabetRow.querySelectorAll('.letter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            alphabetRow.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-letter'));
            e.target.classList.add('active-letter');
            currentLetter = e.target.dataset.letter === 'all' ? null : e.target.dataset.letter;
            dictFilterInput.value = '';
            dictClearBtn.classList.remove('visible');
            dictPage = 1;
            applyDictionaryFilterAndRender();
          });
        });
      }

      function applyDictionaryFilterAndRender() {
        const filterVal = dictFilterInput.value.toLowerCase().trim();
        let filtered = combinedWordList || [];
        
        if (currentLetter) {
           filtered = filtered.filter(w => w.startsWith(currentLetter));
        }
        if (filterVal) {
           filtered = filtered.filter(w => w.includes(filterVal));
        }

        const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
        if (dictPage > totalPages) dictPage = totalPages;
        
        const start = (dictPage - 1) * PAGE_SIZE;
        const paged = filtered.slice(start, start + PAGE_SIZE);

        if (paged.length === 0) {
          dictionaryGrid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">見つかりませんでした</div>';
        } else {
          dictionaryGrid.innerHTML = paged.map(w => {
            const isLearned = !!learnedWords[w.toLowerCase()];
            return `<div class="dict-word-card" data-word="${w}">
              <span class="dict-word-text" title="${w}">${w}</span>
              <button class="btn mini-add-btn" data-word="${w}">${isLearned ? '✓' : '+'}</button>
            </div>`;
          }).join('');

          dictionaryGrid.querySelectorAll('.dict-word-card').forEach(card => {
            card.addEventListener('click', (e) => {
              if (e.target.closest('.mini-add-btn')) return;
              openExpandedWord(card.dataset.word);
            });
          });
          dictionaryGrid.querySelectorAll('.mini-add-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const w = btn.dataset.word;
              if (learnedWords[w.toLowerCase()]) deleteWordCompletely(w);
              else addWordToPractice(w);
              applyDictionaryFilterAndRender();
            });
          });
        }

        let pageHtml = `<button class="btn" id="prevDictPage" ${dictPage===1?'disabled':''}>前へ</button>`;
        pageHtml += `<span class="page-info">ページ ${dictPage} / ${totalPages}</span>`;
        pageHtml += `<button class="btn" id="nextDictPage" ${dictPage===totalPages?'disabled':''}>次へ</button>`;
        dictPagination.innerHTML = pageHtml;

        document.getElementById('prevDictPage')?.addEventListener('click', () => { if (dictPage>1) { dictPage--; applyDictionaryFilterAndRender(); } });
        document.getElementById('nextDictPage')?.addEventListener('click', () => { if (dictPage<totalPages) { dictPage++; applyDictionaryFilterAndRender(); } });
      }

      dictFilterInput.addEventListener('input', (e) => {
        if (e.target.value.trim().length > 0) dictClearBtn.classList.add('visible');
        else dictClearBtn.classList.remove('visible');
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => { dictPage = 1; applyDictionaryFilterAndRender(); }, 250);
      });
      dictClearBtn.addEventListener('click', () => {
        dictFilterInput.value = '';
        dictClearBtn.classList.remove('visible');
        dictPage = 1;
        applyDictionaryFilterAndRender();
      });

      // --- Expanded Word Modal ---
      async function openExpandedWord(word) {
        expandedFloatCard.innerHTML = `<div class="modal-body" style="align-items:center; justify-content:center;"><div class="empty-state">読み込み中…</div></div>`;
        expandOverlay.classList.add('active');
        
        let htmlContent = '';
        const custom = customDefinitions[word.toLowerCase()];
        
        if (custom) {
          htmlContent = custom.html;
        } else {
          const data = await fetchFullDefinitionData(word);
          if (data && data.definitionHTML) {
             htmlContent = data.definitionHTML;
          } else {
             htmlContent = `<div class="no-def-container">
                <span style="color:#7a7268;">定義が見つかりません。</span>
                <button class="create-own-def-btn" data-word="${word}">独自に定義を作成</button>
             </div>`;
          }
        }

        const isLearned = !!learnedWords[word.toLowerCase()];

        expandedFloatCard.innerHTML = `
          <div class="expanded-word-title">${word}</div>
          <div class="expanded-definition">${htmlContent}</div>
          <div class="expanded-actions">
            <button class="close-expanded" id="closeExpandBtn">✕</button>
            <button id="floatAddWordBtn" data-word="${word}">${isLearned ? '学習済みから外す' : '学習済みに追加'}</button>
          </div>
        `;

        document.getElementById('closeExpandBtn').addEventListener('click', () => { expandOverlay.classList.remove('active'); });
        document.getElementById('floatAddWordBtn').addEventListener('click', (e) => {
           const w = e.target.dataset.word;
           if (learnedWords[w.toLowerCase()]) { deleteWordCompletely(w); e.target.textContent = '学習済みに追加'; }
           else { addWordToPractice(w); e.target.textContent = '学習済みから外す'; }
           if (currentTab === 'dictionary') applyDictionaryFilterAndRender();
        });

        const mkBtn = expandedFloatCard.querySelector('.create-own-def-btn');
        if (mkBtn) {
          mkBtn.addEventListener('click', (e) => {
            expandOverlay.classList.remove('active');
            const w = e.target.dataset.word;
            currentEditingWord = w.toLowerCase();
            modalWordTitle.textContent = w + " (カスタム定義)";
            customFreeWriteInput.value = '';
            deleteCustomDefBtn.style.display = 'none';
            customDefModal.classList.add('active');
          });
        }
      }

      expandOverlay.addEventListener('click', (e) => { if(e.target === expandOverlay) expandOverlay.classList.remove('active'); });

      // --- Init ---
      dailyTabBtn.addEventListener('click', () => switchTab('daily'));
      practiceTabBtn.addEventListener('click', () => switchTab('practice'));
      dictionaryTabBtn.addEventListener('click', () => switchTab('dictionary'));
      document.getElementById('refreshWordsBtn').addEventListener('click', refreshDailyWords);

      function switchTab(tab) {
        currentTab = tab;
        dailyTabBtn.classList.remove('btn-primary'); dailyTabBtn.classList.add('btn');
        practiceTabBtn.classList.remove('btn-primary'); practiceTabBtn.classList.add('btn');
        dictionaryTabBtn.classList.remove('btn-primary'); dictionaryTabBtn.classList.add('btn');

        dailyFiveView.classList.add('hidden');
        practiceView.classList.add('hidden');
        dictionaryView.classList.add('hidden');

        if (tab === 'daily') {
          dailyTabBtn.classList.add('btn-primary'); dailyTabBtn.classList.remove('btn');
          dailyFiveView.classList.remove('hidden');
          renderDailyWords();
        } else if (tab === 'practice') {
          practiceTabBtn.classList.add('btn-primary'); practiceTabBtn.classList.remove('btn');
          practiceView.classList.remove('hidden');
          renderLearnedWordsList();
          renderPracticeOnly();
          if (!quizWord && Object.keys(learnedWords).length > 1) startNewQuiz();
          updateCustomFilterDropdown();
        } else if (tab === 'dictionary') {
          dictionaryTabBtn.classList.add('btn-primary'); dictionaryTabBtn.classList.remove('btn');
          dictionaryView.classList.remove('hidden');
          if (alphabetRow.innerHTML === '') renderAlphabetRow();
          if (!combinedWordList) {
             fetchCombinedWordList().then(() => applyDictionaryFilterAndRender());
          } else {
             applyDictionaryFilterAndRender();
          }
        }
      }

      async function init() {
        loadLearnedWords();
        loadVaultTree();
        loadCustomDefinitions();
        loadUserGroups();
        if (!loadDailyWords()) {
          await refreshDailyWords();
        } else {
          renderDailyWords();
        }
        fetchCombinedWordList();
      }

      init();

    })();
  </script>
</body>
</html>
